name: discipline-bot

on:
  schedule:
    # 17:00 UTC (12:00 EST) on days 1-7 of every month, Mon-Fri.
    - cron: "0 17 1-7 * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no orders placed)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: discipline-bot
  cancel-in-progress: false

jobs:
  discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Discipline cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python -m discipline_bot.execute --dry-run
